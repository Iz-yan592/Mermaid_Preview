<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid & Markdown プレビューア</title>

  <!-- Tailwind CSS (ローカルビルド済み / Typography プラグイン同梱) -->
  <link rel="stylesheet" href="./assets/tailwind.min.css">

  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js"
    integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2"
    crossorigin="anonymous"></script>

  <!-- Marked.js (Markdown パーサー) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"
    integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR"
    crossorigin="anonymous"></script>

  <!-- DOMPurify (XSS サニタイザー) -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"
    integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu"
    crossorigin="anonymous"></script>

  <style>
    /* テキストエリア・プレビューのスクロールバー */
    textarea::-webkit-scrollbar,
    .scroll-container::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    textarea::-webkit-scrollbar-thumb,
    .scroll-container::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    textarea::-webkit-scrollbar-thumb:hover,
    .scroll-container::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* プレビュー領域（Mermaid単体モード） */
    .draggable-viewport {
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .draggable-viewport.dragging {
      cursor: grabbing;
    }

    /* 図の配置用レイヤー */
    #transformWrapper {
      position: absolute;
      left: 50%;
      top: 50%;
      display: inline-block;
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    #scaleWrapper {
      display: inline-block;
      transform-origin: center center;
      will-change: transform;
    }

    #mermaidOutput {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #mermaidOutput svg {
      display: block;
      max-width: none;
    }

    /* Markdown 内の Mermaid 図コンテナ */
    .markdown-mermaid-card {
      position: relative;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 1.25rem 1rem;
      margin: 1.5rem 0;
      overflow-x: auto;
      text-align: center;
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .markdown-mermaid-card.has-error {
      border-color: #fca5a5 !important;
      background-color: #fff1f2 !important;
    }

    .markdown-mermaid-card svg {
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      display: inline-block;
    }

    /* Markdown 内のテーブルスタイル補強 */
    #markdownPreviewContainer table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    #markdownPreviewContainer table th {
      background-color: #f1f5f9;
      color: #0f172a;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      padding: 0.6rem 0.85rem;
    }

    #markdownPreviewContainer table td {
      border: 1px solid #e2e8f0;
      padding: 0.6rem 0.85rem;
      vertical-align: top;
    }

    #markdownPreviewContainer table tr:nth-child(even) td {
      background-color: #f8fafc;
    }

    /* ダークテーマ時の Markdown & Mermaid インライン表示スタイル */
    [data-theme="dark"]#markdownPreviewContainer {
      background-color: #0f172a !important;
      color: #f1f5f9 !important;
    }

    [data-theme="dark"] .markdown-mermaid-card {
      background-color: #1e293b !important;
      border-color: #334155 !important;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.4);
    }

    [data-theme="dark"] .markdown-mermaid-card.has-error {
      border-color: #7f1d1d !important;
      background-color: rgba(69, 10, 10, 0.4) !important;
    }

    [data-theme="dark"]#markdownPreviewContainer pre {
      background-color: #1e293b !important;
      border: 1px solid #334155;
      color: #e2e8f0;
    }

    [data-theme="dark"]#markdownPreviewContainer :not(pre) > code {
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
    }

    [data-theme="dark"]#markdownPreviewContainer blockquote {
      border-left-color: #6366f1;
      color: #cbd5e1;
      background-color: rgba(30, 41, 59, 0.5);
    }

    [data-theme="dark"]#markdownPreviewContainer table th {
      background-color: #1e293b !important;
      border-color: #334155 !important;
      color: #f8fafc !important;
    }

    [data-theme="dark"]#markdownPreviewContainer table td {
      border-color: #334155 !important;
      background-color: #0f172a !important;
    }

    [data-theme="dark"]#markdownPreviewContainer table tr:nth-child(even) td {
      background-color: #172033 !important;
    }

    [data-theme="dark"]#markdownPreviewContainer hr {
      border-color: #334155;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">

      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
          M
        </div>

        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">
            Mermaid & Markdown Previewer
          </h1>
          <p class="text-xs text-slate-500 hidden sm:block">
            構文プレビュー & 高解像度エクスポート
          </p>
        </div>

        <!-- モード切替セグメントコントロール -->
        <div class="inline-flex p-0.5 bg-slate-200/80 rounded-lg border border-slate-300 ml-2" role="tablist" aria-label="プレビューモード">
          <button
            type="button"
            id="modeMermaidBtn"
            role="tab"
            aria-selected="false"
            class="px-3 py-1 text-xs font-semibold rounded-md transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5"
            title="Mermaid単体モード（パン・ズーム・画像保存）"
          >
            <span>📐</span> Mermaid
          </button>
          <button
            type="button"
            id="modeMarkdownBtn"
            role="tab"
            aria-selected="true"
            class="px-3 py-1 text-xs font-semibold rounded-md transition-all shadow-sm bg-white text-indigo-600 flex items-center gap-1.5"
            title="Markdown文書モード（文章＋インライン図＋テーブル）"
          >
            <span>📝</span> Markdown
          </button>
        </div>
      </div>

      <!-- コントロール群 -->
      <div class="flex flex-wrap items-center gap-2">

        <!-- テンプレート選択 -->
        <select
          id="templateSelect"
          class="text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-md px-2.5 py-1.5 font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500"
          aria-label="サンプルを挿入"
        >
          <!-- 動的生成 -->
        </select>

        <!-- テーマ切り替え -->
        <select
          id="themeSelect"
          class="text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-md px-2.5 py-1.5 font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500"
          aria-label="テーマを選択"
        >
          <option value="default">テーマ: デフォルト</option>
          <option value="neutral">テーマ: ニュートラル</option>
          <option value="dark">テーマ: ダーク</option>
          <option value="forest">テーマ: フォレスト</option>
        </select>

        <!-- レイアウト切り替え -->
        <button
          type="button"
          id="layoutToggleBtn"
          class="hidden md:inline-flex items-center gap-1 text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-medium px-2.5 py-1.5 rounded-md transition-colors"
          title="上下並びと左右分割を切り替えます"
          aria-label="レイアウト切り替え"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <span id="layoutText">左右分割に切替</span>
        </button>

      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6 flex flex-col gap-4">

    <!-- ワークスペース -->
    <div id="workspace" class="flex flex-col gap-4 flex-1">

      <!-- エディタセクション -->
      <section class="flex flex-col bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex-1 min-h-[260px] md:min-h-[300px]">

        <div class="bg-slate-100/80 px-4 py-2 border-b border-slate-200 flex items-center justify-between">

          <div class="flex items-center gap-2">
            <span id="editorLabel" class="text-xs font-semibold uppercase tracking-wider text-slate-600">
              Markdown Text
            </span>

            <span id="statInfo" class="text-[11px] text-slate-600 bg-white px-1.5 py-0.5 rounded border border-slate-200 font-mono">
              0 行 | 0 文字
            </span>
          </div>

          <div class="flex items-center gap-1.5">
            <button
              type="button"
              id="pasteBtn"
              class="text-xs text-slate-600 hover:text-indigo-600 font-medium px-2 py-1 rounded hover:bg-slate-200 transition-colors"
              title="クリップボードから貼り付け（自動モード判別）"
            >
              ペースト
            </button>

            <button
              type="button"
              id="clearBtn"
              class="text-xs text-slate-600 hover:text-red-600 font-medium px-2 py-1 rounded hover:bg-slate-200 transition-colors"
              title="内容を消去"
            >
              クリア
            </button>
          </div>
        </div>

        <div class="relative flex-1">
          <textarea
            id="editorInput"
            spellcheck="false"
            placeholder="# タイトル&#10;&#10;ここにMarkdownを入力...&#10;&#10;```mermaid&#10;graph TD&#10;    A --> B&#10;```"
            class="w-full h-full min-h-[220px] p-3.5 font-mono text-xs sm:text-sm text-slate-800 bg-transparent resize-y md:resize-none focus:outline-none leading-relaxed"
            aria-label="テキスト入力エリア"
          ></textarea>
        </div>
      </section>

      <!-- プレビューセクション -->
      <section class="flex flex-col bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex-1 min-h-[340px] md:min-h-[380px]">

        <!-- プレビューヘッダー -->
        <div class="bg-slate-100/80 px-4 py-2 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">

          <div class="flex items-center gap-2">
            <span id="previewLabel" class="text-xs font-semibold uppercase tracking-wider text-slate-600">
              Markdown Preview
            </span>

            <!-- ステータスバッジ（クリックでエラー図へジャンプ可能） -->
            <button
              type="button"
              id="statusIndicator"
              class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-slate-100 text-slate-600 border border-slate-200 transition-all cursor-default"
              title="描画ステータス"
            >
              入力待機
            </button>
          </div>

          <!-- Mermaid 専用ツールバー -->
          <div id="mermaidToolbar" class="hidden flex items-center gap-2 sm:gap-1.5">
            <button
              type="button"
              id="zoomOutBtn"
              class="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors"
              title="縮小"
              aria-label="縮小"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
              </svg>
            </button>

            <button
              type="button"
              id="zoomResetBtn"
              class="px-2 py-1 text-xs font-mono text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors"
              title="表示倍率リセット"
              aria-label="倍率を100%にリセット"
            >
              <span id="zoomLevel">100%</span>
            </button>

            <button
              type="button"
              id="fitBtn"
              class="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors flex items-center gap-1"
              title="画面サイズに合わせる"
              aria-label="画面枠内に全体表示"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
              </svg>
              <span class="text-[11px] hidden sm:inline font-medium">フィット</span>
            </button>

            <button
              type="button"
              id="zoomInBtn"
              class="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors"
              title="拡大"
              aria-label="拡大"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
            </button>

            <div class="w-px h-4 bg-slate-300 mx-1"></div>

            <button
              type="button"
              id="copySvgBtn"
              class="text-xs text-slate-700 bg-white hover:bg-slate-100 border border-slate-300 font-medium px-2 py-1 rounded transition-colors"
              title="SVGコードをコピー"
            >
              SVGコピー
            </button>

            <button
              type="button"
              id="downloadSvgBtn"
              class="text-xs text-slate-700 bg-white hover:bg-slate-100 border border-slate-300 font-medium px-2 py-1 rounded transition-colors"
              title="SVG画像を保存"
            >
              SVG保存
            </button>

            <button
              type="button"
              id="downloadPngBtn"
              class="text-xs text-white bg-indigo-600 hover:bg-indigo-700 font-medium px-2.5 py-1 rounded transition-colors shadow-sm"
              title="PNG画像を保存"
            >
              PNG保存
            </button>
          </div>

          <!-- Markdown 専用ツールバー -->
          <div id="markdownToolbar" class="flex items-center gap-1.5">
            <button
              type="button"
              id="copyHtmlBtn"
              class="text-xs text-slate-700 bg-white hover:bg-slate-100 border border-slate-300 font-medium px-2.5 py-1 rounded transition-colors flex items-center gap-1"
              title="レンダリングされたプレビューHTMLをコピー"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
              </svg>
              <span>プレビューHTMLコピー</span>
            </button>

            <button
              type="button"
              id="downloadMdBtn"
              class="text-xs text-white bg-indigo-600 hover:bg-indigo-700 font-medium px-2.5 py-1 rounded transition-colors shadow-sm flex items-center gap-1"
              title="Markdownファイルとしてダウンロード"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
              </svg>
              <span>.md保存</span>
            </button>
          </div>

        </div>

        <!-- プレビュー表示領域 -->
        <div class="relative flex-1 overflow-hidden flex flex-col">

          <!-- 1. Mermaid 単体パン・ズームキャンバス -->
          <div
            id="mermaidPreviewContainer"
            class="hidden relative flex-1 overflow-hidden bg-slate-50/50 draggable-viewport flex items-center justify-center p-4 transition-colors duration-200"
            aria-label="Mermaid図のプレビュー領域"
          >
            <!-- パン用レイヤー -->
            <div id="transformWrapper">
              <!-- ズーム用レイヤー -->
              <div id="scaleWrapper">
                <div id="mermaidOutput"></div>
              </div>
            </div>

            <!-- エラー通知ボックス（Mermaid単体モード用） -->
            <div
              id="errorBox"
              class="hidden absolute bottom-4 left-4 right-4 bg-red-50/95 border border-red-200 text-red-700 p-3 rounded-lg shadow-md backdrop-blur-sm z-20"
            >
              <div class="flex items-start gap-2">
                <svg
                  class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div class="flex-1 overflow-auto max-h-24">
                  <h4 class="text-xs font-bold">構文エラーが発生しました</h4>
                  <p id="errorMessage" class="text-xs font-mono mt-0.5 whitespace-pre-wrap leading-relaxed text-red-600"></p>
                </div>
              </div>
            </div>

            <!-- 初期空状態案内 -->
            <div
              id="emptyGuide"
              class="hidden absolute inset-0 flex flex-col items-center justify-center text-slate-400 pointer-events-none p-6 text-center"
            >
              <svg class="w-12 h-12 mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
              </svg>
              <p class="text-sm font-medium">Mermaid記法を入力するとリアルタイムで描画されます</p>
              <p class="text-xs mt-1 text-slate-400">右上のサンプルから各種ダイアグラムを試せます</p>
            </div>
          </div>

          <!-- 2. Markdown 専用縦スクロール領域 -->
          <div
            id="markdownPreviewContainer"
            class="relative flex-1 overflow-y-auto p-6 md:p-8 bg-white scroll-container prose prose-slate max-w-none transition-colors duration-200"
            aria-label="Markdown文書のプレビュー領域"
          >
            <!-- marked.js で変換された HTML が入る -->
          </div>

        </div>
      </section>

    </div>
  </main>

  <!-- トースト通知 -->
  <div
    id="toast"
    class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-3.5 py-2 rounded-lg shadow-lg transform translate-y-12 opacity-0 transition-all duration-200 pointer-events-none z-50"
  >
    通知メッセージ
  </div>

  <script>
    // ============================================================
    // モード設定（UI表記・ラベル・プレースホルダーの一元定義）
    // ============================================================

    const MODE_CONFIG = {
      mermaid: {
        id: 'mermaid',
        displayName: 'Mermaid単体',
        editorLabel: 'Mermaid Code',
        previewLabel: 'Diagram Preview',
        editorPlaceholder: 'graph TD;\n    A["開始"] --> B{"判定"};\n    B -->|"はい"| C["実行"];\n    B -->|"いいえ"| D["終了"];',
        editorAriaLabel: 'Mermaidコード入力エリア',
        successStatusText: '正常描画'
      },
      markdown: {
        id: 'markdown',
        displayName: 'Markdown文書',
        editorLabel: 'Markdown Text',
        previewLabel: 'Markdown Preview',
        editorPlaceholder: '# タイトル\n\nここにMarkdownを入力...\n\n```mermaid\ngraph TD\n    A --> B\n```\n\n| 列1 | 列2 |\n|---|---|\n| 値1 | 値2 |',
        editorAriaLabel: 'Markdownテキスト入力エリア',
        successStatusText: '正常描画'
      }
    };

    // 描画時とSVG/PNGエクスポート時でフォント幅計算を完全一致させるための共通フォントスタック
    const EXPORT_FONT_FAMILY = '"Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", "Segoe UI", system-ui, -apple-system, sans-serif';

    // ============================================================
    // 厳格に構文検証されたテンプレート定義
    // ============================================================

    const MERMAID_TEMPLATES = {
      flowchart: `graph TD
    A["ユーザーアクセス"] --> B{"ログイン状態?"}
    B -->|"ログイン済"| C["ダッシュボード表示"]
    B -->|"未ログイン"| D["認証画面へ遷移"]
    D --> E["ID・パスワード入力"]
    E --> B`,

      sequence: `sequenceDiagram
    autonumber
    actor User as ユーザー
    participant UI as プレビュー画面
    participant Browser as ブラウザ (DOM)
    participant FS as ファイルシステム

    User->>UI: SVG保存ボタン押下
    UI->>Browser: SVG要素のXML文字列を取得
    Browser-->>UI: シリアライズされた文字列
    UI->>Browser: Data URLの生成

    function detectContentMode(text) {

    // ============================================================

    // ============================================================

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    const MIN_SCALE = 0.2;
    const MAX_SCALE = 4.0;
    const CANVAS_PADDING = 32;
    const WIDTH_FIT_THRESHOLD = 0.5;

    const activePointers = new Map();
    let initialPinchDistance = null;
    let initialScale = 1;
    let initialMidpoint = null;
    let initialTranslateX = 0;
    let initialTranslateY = 0;

    function updateTransform() {
      transformWrapper.style.transform = `translate(calc(-50% + ${translateX}px), calc(-50% + ${translateY}px))`;
      scaleWrapper.style.transform = `scale(${scale})`;
      zoomLevel.textContent = `${Math.round(scale * 100)}%`;
    }

    function resetView() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function fitToScreen() {
      if (currentMode !== 'mermaid') return;

      const svg = mermaidOutput.querySelector('svg');
      if (!svg) return;

      let svgW = 0;
      let svgH = 0;

      if (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
        svgW = svg.viewBox.baseVal.width;
        svgH = svg.viewBox.baseVal.height;
      } else {
        try {
          const bbox = svg.getBBox();
          if (bbox.width > 0) {
            svgW = bbox.width;
            svgH = bbox.height;
          }
        } catch (_) {}
      }

      if (!svgW || !svgH) {
        const rect = svg.getBoundingClientRect();
        svgW = rect.width / (scale || 1);
        svgH = rect.height / (scale || 1);
      }

      if (!svgW || !svgH) {
        svgW = 800;
        svgH = 600;
      }

      const containerRect = mermaidPreviewContainer.getBoundingClientRect();
      const availW = Math.max(containerRect.width - CANVAS_PADDING, 80);
      const availH = Math.max(containerRect.height - CANVAS_PADDING, 80);

      const fitScale = Math.min(availW / svgW, availH / svgH);
      const widthScale = availW / svgW;

      // 方式A（幅フィット＋縦パン）: 縦長図では横幅基準でスケールを決め、上端をコンテナ上端に揃える
      if (fitScale < WIDTH_FIT_THRESHOLD && widthScale > fitScale) {
        const newScale = Math.min(Math.max(widthScale, MIN_SCALE), 1.1);
        const rectNow = svg.getBoundingClientRect();
        const layoutH = (rectNow.height && scale) ? rectNow.height / scale : svgH;
        scale = newScale;
        translateX = 0;
        translateY = (layoutH * newScale - containerRect.height) / 2 + CANVAS_PADDING / 2;
        updateTransform();
        return;
      }

      scale = Math.min(Math.max(fitScale, MIN_SCALE), 1.1);
      translateX = 0;
      translateY = 0;

      updateTransform();
    }

    function zoomToPoint(newScale, originClientX, originClientY) {
      const clampedScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);
      if (clampedScale === scale) return;

      const rect = mermaidPreviewContainer.getBoundingClientRect();
      const px = originClientX - (rect.left + rect.width / 2);
      const py = originClientY - (rect.top + rect.height / 2);

      const scaleRatio = clampedScale / scale;
      translateX = px - (px - translateX) * scaleRatio;
      translateY = py - (py - translateY) * scaleRatio;
      scale = clampedScale;

      updateTransform();
    }

    function getDistance(p1, p2) {
      return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
    }

    function getMidpoint(p1, p2) {
      return {
        clientX: (p1.clientX + p2.clientX) / 2,
        clientY: (p1.clientY + p2.clientY) / 2
      };
    }

    mermaidPreviewContainer.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || e.target.closest('#errorBox') || e.target.closest('select')) {
        return;
      }

      mermaidPreviewContainer.setPointerCapture(e.pointerId);
      mermaidPreviewContainer.classList.add('dragging');
      activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

      if (activePointers.size === 2) {
        const [p1, p2] = Array.from(activePointers.values());
        initialPinchDistance = getDistance(p1, p2);
        initialScale = scale;
        initialMidpoint = getMidpoint(p1, p2);
        initialTranslateX = translateX;
        initialTranslateY = translateY;
      }
    });

    mermaidPreviewContainer.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;

      const prevPos = activePointers.get(e.pointerId);

      if (activePointers.size === 1) {
        const dx = e.clientX - prevPos.clientX;
        const dy = e.clientY - prevPos.clientY;
        translateX += dx;
        translateY += dy;
        updateTransform();
        activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
      } else if (activePointers.size === 2) {
        activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
        const [p1, p2] = Array.from(activePointers.values());
        const currentDistance = getDistance(p1, p2);
        const currentMid = getMidpoint(p1, p2);

        if (initialPinchDistance && initialPinchDistance > 0 && initialMidpoint) {
          const ratio = currentDistance / initialPinchDistance;
          const targetScale = Math.min(Math.max(initialScale * ratio, MIN_SCALE), MAX_SCALE);

          const rect = mermaidPreviewContainer.getBoundingClientRect();
          const pMidX = initialMidpoint.clientX - (rect.left + rect.width / 2);
          const pMidY = initialMidpoint.clientY - (rect.top + rect.height / 2);

          const scaleRatio = targetScale / initialScale;
          const panDx = currentMid.clientX - initialMidpoint.clientX;
          const panDy = currentMid.clientY - initialMidpoint.clientY;

          translateX = (pMidX - (pMidX - initialTranslateX) * scaleRatio) + panDx;
          translateY = (pMidY - (pMidY - initialTranslateY) * scaleRatio) + panDy;
          scale = targetScale;

          updateTransform();
        }
      }
    });

    function handlePointerEnd(e) {
      if (activePointers.has(e.pointerId)) {
        activePointers.delete(e.pointerId);
        try {
          mermaidPreviewContainer.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }

      if (activePointers.size < 2) {
        initialPinchDistance = null;
        initialMidpoint = null;
      }
      if (activePointers.size === 0) {
        mermaidPreviewContainer.classList.remove('dragging');
      }
    }

    mermaidPreviewContainer.addEventListener('pointerup', handlePointerEnd);
    mermaidPreviewContainer.addEventListener('pointercancel', handlePointerEnd);

    // ピンチ（ctrlKey付きwheel）と通常スクロールを区別する:
    // ピンチはズーム、2本指スクロール／ホイールは縦方向のパン
    function clampPanY() {
      const svg = mermaidOutput.querySelector('svg');
      if (!svg) return;
      const containerH = mermaidPreviewContainer.clientHeight;
      const contentH = svg.getBoundingClientRect().height;
      const limit = Math.max(0, (containerH + contentH) / 2 - 80);
      translateY = Math.min(Math.max(translateY, -limit), limit);
    }

    mermaidPreviewContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
        zoomToPoint(scale * zoomFactor, e.clientX, e.clientY);
        return;
      }
      let dy = e.deltaY;
      if (e.deltaMode === 1) dy *= 16;
      else if (e.deltaMode === 2) dy *= mermaidPreviewContainer.clientHeight;
      if (dy === 0) return;
      translateY -= dy;
      clampPanY();
      updateTransform();
    }, { passive: false });

    // ============================================================
    // レンダリングロジック & SVG寸法正規化
    // ============================================================

    let retryCount = 0;

    // Markdown内Mermaid図のSVGキャッシュ（FIFO/LRU管理）
    const mdSvgCache = new Map();
    const MD_SVG_CACHE_MAX = 200;

    // ノードラベルのコントラスト補正: classDef で淡色の fill だけを指定すると、
    // ダークテーマではラベル文字がテーマ既定の淡色のまま残り、背景に埋もれて読めなくなる。
    // ノード図形の実効 fill とラベル文字色のコントラスト比を測り、読みにくい組合せ
    // （比が 3.0 未満）のときだけ、コントラストの高い方（濃色／淡色）へ寄せる。
    // テーマ既定のノードや、classDef で color まで指定済みのノードは比が十分あるため対象外。
    // 対象は図形とラベルを同じグループに持つ図種（フローチャート／状態遷移図）の g.node のみ。
    function fixNodeLabelContrast(svgRoot) {
      if (!svgRoot) return;
      const DARK_TEXT = '#1e293b';
      const LIGHT_TEXT = '#f8fafc';
      const parseRgb = (s) => {
        const m = /rgba?\(([^)]+)\)/.exec(s || '');
        if (!m) return null;
        const p = m[1].split(',').map(v => parseFloat(v));
        return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
      };
      const luminance = ({ r, g, b }) => {
        const f = (c) => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
      };
      const contrastRatio = (l1, l2) => (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
      const darkL = luminance({ r: 30, g: 41, b: 59 });
      const lightL = luminance({ r: 248, g: 250, b: 252 });

      svgRoot.querySelectorAll('g.node').forEach((g) => {
        const shape = [...g.children].find((el) => /^(rect|polygon|circle|ellipse|path)$/.test(el.tagName));
        if (!shape) return;
        const fill = parseRgb(getComputedStyle(shape).fill);
        if (!fill || fill.a === 0) return;

        const foDivs = g.querySelectorAll('foreignObject div, foreignObject span, foreignObject p');
        const texts = g.querySelectorAll('text, tspan');
        let labelColor = null;
        if (foDivs.length) {
          // 文字色は「実際に文字を持つ最深の要素」から採る。外側の div はページ側CSSの
          // 色を継いでいるだけのことがあり（状態遷移図など）、文字色とは限らない。
          let textBearer = null;
          g.querySelectorAll('foreignObject *').forEach((el) => {
            if ([...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())) textBearer = el;
          });
          labelColor = parseRgb(getComputedStyle(textBearer || foDivs[0]).color);
        } else if (texts.length) labelColor = parseRgb(getComputedStyle(texts[0]).fill);
        if (!labelColor) return;

        const fillL = luminance(fill);
        if (contrastRatio(fillL, luminance(labelColor)) >= 3.0) return;

        const target = contrastRatio(fillL, darkL) >= contrastRatio(fillL, lightL) ? DARK_TEXT : LIGHT_TEXT;
        foDivs.forEach((el) => el.style.setProperty('color', target, 'important'));
        texts.forEach((el) => el.style.setProperty('fill', target, 'important'));
      });
    }

    // 単体モード用: SVGの寸法をviewBox基準の明示サイズに正規化
    function normalizeSvgSize(svg) {
      if (!svg) return;
      const vb = svg.viewBox && svg.viewBox.baseVal;
      if (!vb || !vb.width || !vb.height) return;
      svg.setAttribute('width', vb.width);
      svg.setAttribute('height', vb.height);
      svg.style.removeProperty('max-width');
      svg.style.removeProperty('width');
      svg.style.removeProperty('height');
    }

    async function renderPreview(isRetry = false) {
      if (missingLibs.length > 0) {
        showCdnError();
        return;
      }
      const rawCode = editorInput.value;
      const code = rawCode.trim();
      updateStatInfo(rawCode);

      renderVersion++;
      const currentVersion = renderVersion;

      cleanupMermaidGarbage();

      if (currentMode === 'mermaid') {
        if (!code) {
          mermaidOutput.innerHTML = '';
          errorBox.classList.add('hidden');
          emptyGuide.classList.remove('hidden');
          setStatus('waiting', '入力待機');
          return;
        }

        emptyGuide.classList.add('hidden');
        setStatus('rendering', '描画中...');
        renderCount++;
        const uniqueId = `mermaid-render-${Date.now()}-${renderCount}`;

        try {
          const { svg } = await mermaid.render(uniqueId, code);
          cleanupMermaidGarbage();

          if (currentVersion !== renderVersion) return;

          mermaidOutput.innerHTML = svg;
          normalizeSvgSize(mermaidOutput.querySelector('svg'));
          fixNodeLabelContrast(mermaidOutput.querySelector('svg'));
          errorBox.classList.add('hidden');
          setStatus('success', MODE_CONFIG.mermaid.successStatusText);
          retryCount = 0;

          if (isInitialRender) {
            fitToScreen();
            isInitialRender = false;
          }
        } catch (err) {
          cleanupMermaidGarbage();

          if (!isRetry && retryCount < 1) {
            retryCount++;
            const retryVersion = currentVersion;
            setTimeout(() => {
              if (renderVersion !== retryVersion) return;
              renderPreview(true);
            }, 120);
            return;
          }

          if (currentVersion !== renderVersion) return;
          const msg = err.message || err.str || String(err);
          errorMessage.textContent = msg;
          errorBox.classList.remove('hidden');
          setStatus('error', '構文エラー');
        }
      } else {
        if (!code) {
          markdownPreviewContainer.innerHTML = '<p class="text-slate-400 italic">Markdownを入力すると、ここにプレビューが表示されます...</p>';
          setStatus('waiting', '入力待機');
          return;
        }

        setStatus('rendering', 'パース中...');
        mdMermaidCounter = 0;

        try {
          const rawHtml = marked.parse(code);

          // セキュリティ改善: Mermaid描画前のサニタイズでは <style> / <foreignObject> 等を厳格に禁止
          const cleanHtml = DOMPurify.sanitize(rawHtml, {
            ADD_TAGS: ['button', 'input'],
            ADD_ATTR: [
              'id', 'class', 'data-card-id', 'data-code', 'data-target',
              'target', 'rel', 'title', 'align', 'colspan', 'rowspan',
              'type', 'checked', 'disabled'
            ],
            FORBID_TAGS: ['script', 'style', 'iframe', 'object', 'embed', 'foreignObject'],
            FORBID_ATTR: ['onerror', 'onload', 'onclick', 'onmouseover', 'onfocus', 'srcdoc']
          });

          if (currentVersion !== renderVersion) return;

          markdownPreviewContainer.innerHTML = cleanHtml;

          const mermaidNodes = markdownPreviewContainer.querySelectorAll('.mermaid-diagram');
          const totalDiagrams = mermaidNodes.length;

          if (totalDiagrams === 0) {
            if (currentVersion === renderVersion) {
              setStatus('success', `${MODE_CONFIG.markdown.successStatusText} (図なし)`);
            }
            return;
          }

          let errorCount = 0;
          setStatus('rendering', `図を描画中 (0/${totalDiagrams})...`);

          let diagramIndex = 0;
          for (const node of mermaidNodes) {
            if (currentVersion !== renderVersion) return;

            diagramIndex++;
            const diagramCode = decodeURIComponent(node.getAttribute('data-code') || '');
            const cardId = node.getAttribute('data-card-id');
            const cardElement = cardId ? document.getElementById(cardId) : node.closest('.markdown-mermaid-card');

            if (!diagramCode) continue;

            const cacheKey = `${currentTheme}:${diagramIndex}\n${diagramCode}`;
            const cachedSvg = mdSvgCache.get(cacheKey);

            try {
              let svg;
              if (cachedSvg) {
                svg = cachedSvg;
              } else {
                renderCount++;
                const diagramId = `md-mermaid-${Date.now()}-${renderCount}`;
                const rendered = await mermaid.render(diagramId, diagramCode);
                svg = rendered.svg;
                if (mdSvgCache.size >= MD_SVG_CACHE_MAX) {
                  const oldestKey = mdSvgCache.keys().next().value;
                  mdSvgCache.delete(oldestKey);
                }
                mdSvgCache.set(cacheKey, svg);
              }
              cleanupMermaidGarbage();

              if (currentVersion === renderVersion) {
                node.innerHTML = svg;
                fixNodeLabelContrast(node.querySelector('svg'));
                if (cardElement) cardElement.classList.remove('has-error');
              }
            } catch (err) {
              cleanupMermaidGarbage();

              if (currentVersion === renderVersion) {
                errorCount++;
                if (cardElement) {
                  cardElement.classList.add('has-error');
                  const actBar = cardElement.querySelector('.card-action-bar');
                  if (actBar) actBar.classList.add('hidden');
                }

                const msg = err.message || err.str || String(err);
                node.innerHTML = `
                  <div class="text-xs text-red-600 dark:text-red-400 font-mono p-3 bg-red-50 dark:bg-red-950/40 rounded-lg border border-red-200 dark:border-red-900/60 text-left">
                    <div class="font-bold flex items-center gap-1.5 mb-1 text-red-700 dark:text-red-300">
                      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                      Mermaid 描画エラー
                    </div>
                    <div class="whitespace-pre-wrap leading-relaxed opacity-95">${escapeHtml(msg)}</div>
                  </div>
                `;
              }
            }
          }

          if (currentVersion === renderVersion) {
            if (errorCount === 0) {
              setStatus('success', `${MODE_CONFIG.markdown.successStatusText} (${totalDiagrams}個の図)`);
            } else if (errorCount === totalDiagrams) {
              setStatus('error', `図の構文エラー (${errorCount}件) [クリックでジャンプ]`, true);
            } else {
              setStatus('warning', `図にエラーあり (${errorCount}/${totalDiagrams}件) [クリックでジャンプ]`, true);
            }
          }
        } catch (err) {
          cleanupMermaidGarbage();
          if (currentVersion !== renderVersion) return;
          markdownPreviewContainer.innerHTML = `<div class="text-red-500 text-sm">Markdownパースエラー: ${escapeHtml(err.message || String(err))}</div>`;
          setStatus('error', 'Markdownパース失敗');
        }
      }
    }

    function scheduleRender() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        renderPreview();
        saveState();
      }, 250);
    }

    // ============================================================
    // テンプレート管理
    // ============================================================

    function updateTemplateOptions() {
      templateSelect.innerHTML = '';

      if (currentMode === 'mermaid') {
        const defaultOpt = document.createElement('option');
        defaultOpt.value = '';
        defaultOpt.textContent = '📐 サンプル図を挿入...';
        defaultOpt.disabled = true;
        defaultOpt.selected = true;
        templateSelect.appendChild(defaultOpt);

        const options = [
          { value: 'flowchart', text: 'フローチャート (Flowchart)' },
          { value: 'sequence', text: 'シーケンス図 (Sequence)' },
          { value: 'classDiagram', text: 'クラス図 (Class Diagram)' },
          { value: 'stateDiagram', text: '状態遷移図 (State)' },
          { value: 'erDiagram', text: 'ER図 (Entity Relationship)' },
          { value: 'gantt', text: 'ガントチャート (Gantt)' },
          { value: 'mindmap', text: 'マインドマップ (Mindmap)' }
        ];
        options.forEach(opt => {
          const el = document.createElement('option');
          el.value = opt.value;
          el.textContent = opt.text;
          templateSelect.appendChild(el);
        });
      } else {
        const defaultOpt = document.createElement('option');
        defaultOpt.value = '';
        defaultOpt.textContent = '📝 Markdownサンプルを挿入...';
        defaultOpt.disabled = true;
        defaultOpt.selected = true;
        templateSelect.appendChild(defaultOpt);

        const options = [
          { value: 'spec', text: 'システム設計仕様書 (Mermaid統合)' },
          { value: 'simple', text: 'クイックメモ & フロー' }
        ];
        options.forEach(opt => {
          const el = document.createElement('option');
          el.value = opt.value;
          el.textContent = opt.text;
          templateSelect.appendChild(el);
        });
      }
    }

    // ============================================================
    // モード切替
    // ============================================================

    function switchMode(newMode, notify = true, preserveInput = false) {
      clearTimeout(debounceTimer);

      if (!preserveInput) {
        if (currentMode === 'mermaid') {
          mermaidCode = editorInput.value;
        } else {
          markdownCode = editorInput.value;
        }
      }

      currentMode = newMode;
      const config = MODE_CONFIG[currentMode];

      editorLabel.textContent = config.editorLabel;
      previewLabel.textContent = config.previewLabel;
      editorInput.placeholder = config.editorPlaceholder;
      editorInput.setAttribute('aria-label', config.editorAriaLabel);

      if (currentMode === 'mermaid') {
        modeMermaidBtn.setAttribute('aria-selected', 'true');
        modeMarkdownBtn.setAttribute('aria-selected', 'false');
        modeMermaidBtn.className = 'px-3 py-1 text-xs font-semibold rounded-md transition-all shadow-sm bg-white text-indigo-600 flex items-center gap-1.5';
        modeMarkdownBtn.className = 'px-3 py-1 text-xs font-semibold rounded-md transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5';

        if (!preserveInput) editorInput.value = mermaidCode;

        mermaidToolbar.classList.remove('hidden');
        markdownToolbar.classList.add('hidden');
        mermaidPreviewContainer.classList.remove('hidden');
        markdownPreviewContainer.classList.add('hidden');

        updateTemplateOptions();
        renderPreview();
      } else {
        modeMarkdownBtn.setAttribute('aria-selected', 'true');
        modeMermaidBtn.setAttribute('aria-selected', 'false');
        modeMarkdownBtn.className = 'px-3 py-1 text-xs font-semibold rounded-md transition-all shadow-sm bg-white text-indigo-600 flex items-center gap-1.5';
        modeMermaidBtn.className = 'px-3 py-1 text-xs font-semibold rounded-md transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5';

        if (!preserveInput) editorInput.value = markdownCode;

        mermaidToolbar.classList.add('hidden');
        markdownToolbar.classList.remove('hidden');
        mermaidPreviewContainer.classList.add('hidden');
        markdownPreviewContainer.classList.remove('hidden');

        updateTemplateOptions();
        renderPreview();
      }

      saveState();

      if (notify) {
        showToast(`モードを [${config.displayName}] に切り替えました`);
      }
    }

    modeMermaidBtn.addEventListener('click', () => switchMode('mermaid', true));
    modeMarkdownBtn.addEventListener('click', () => switchMode('markdown', true));

    // ============================================================
    // テーマ & レイアウト & リサイズ連動
    // ============================================================

    function applyCanvasTheme(theme) {
      mermaidPreviewContainer.setAttribute('data-theme', theme);
      markdownPreviewContainer.setAttribute('data-theme', theme);

      if (theme === 'dark') {
        mermaidPreviewContainer.classList.remove('bg-slate-50/50');
        mermaidPreviewContainer.classList.add('bg-slate-900');
        markdownPreviewContainer.classList.add('prose-invert', 'bg-slate-900', 'text-slate-100');
        markdownPreviewContainer.classList.remove('bg-white', 'text-slate-800');
      } else {
        mermaidPreviewContainer.classList.remove('bg-slate-900');
        mermaidPreviewContainer.classList.add('bg-slate-50/50');
        markdownPreviewContainer.classList.remove('prose-invert', 'bg-slate-900', 'text-slate-100');
        markdownPreviewContainer.classList.add('bg-white', 'text-slate-800');
      }
    }

    function applyLayout(sideBySide) {
      isSideBySide = sideBySide;
      if (isSideBySide) {
        workspace.classList.remove('flex-col');
        workspace.classList.add('md:flex-row', 'md:h-[calc(100vh-6.5rem)]');
        layoutText.textContent = '上下配置に切替';
      } else {
        workspace.classList.add('flex-col');
        workspace.classList.remove('md:flex-row', 'md:h-[calc(100vh-6.5rem)]');
        layoutText.textContent = '左右分割に切替';
      }
    }

    themeSelect.addEventListener('change', (e) => {
      currentTheme = e.target.value;
      applyCanvasTheme(currentTheme);
      initMermaid(currentTheme);
      saveState();
      renderPreview().then(() => {
        if (currentMode === 'mermaid') fitToScreen();
      });
      showToast(`テーマを [${themeSelect.options[themeSelect.selectedIndex].text}] に設定しました`);
    });

    layoutToggleBtn.addEventListener('click', () => {
      applyLayout(!isSideBySide);
      saveState();
      setTimeout(() => {
        if (currentMode === 'mermaid') fitToScreen();
      }, 60);
    });

    window.addEventListener('resize', () => {
      if (currentMode !== 'mermaid') return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        fitToScreen();
      }, 150);
    });

    templateSelect.addEventListener('change', (e) => {
      const key = e.target.value;
      if (currentMode === 'mermaid') {
        if (MERMAID_TEMPLATES[key]) {
          editorInput.value = MERMAID_TEMPLATES[key];
          mermaidCode = editorInput.value;
          saveState();
          renderPreview().then(() => fitToScreen());
          showToast('Mermaidサンプルを挿入しました');
        }
      } else {
        if (MARKDOWN_TEMPLATES[key]) {
          editorInput.value = MARKDOWN_TEMPLATES[key];
          markdownCode = editorInput.value;
          saveState();
          renderPreview();
          showToast('Markdownサンプルを挿入しました');
        }
      }
      e.target.value = '';
    });

    // ============================================================
    // エディタ操作 & エクスポート（文字見切れ防止パディング・フォント統一）
    // ============================================================

    /**
     * SVGエクスポート・PNG変換用にviewBox余白とフォント定義を最適化したクリーンなSVGを生成する
     */
    function prepareCleanSvgForExport(svgElement, includeBackground = false) {
      let minX = 0;
      let minY = 0;
      let width = 0;
      let height = 0;

      if (svgElement.viewBox && svgElement.viewBox.baseVal && svgElement.viewBox.baseVal.width > 0) {
        minX = svgElement.viewBox.baseVal.x;
        minY = svgElement.viewBox.baseVal.y;
        width = svgElement.viewBox.baseVal.width;
        height = svgElement.viewBox.baseVal.height;
      } else {
        try {
          const bbox = svgElement.getBBox();
          minX = bbox.x;
          minY = bbox.y;
          width = bbox.width;
          height = bbox.height;
        } catch (_) {}
      }

      if (!width || !height) {
        const rect = svgElement.getBoundingClientRect();
        width = rect.width / (scale || 1);
        height = rect.height / (scale || 1);
      }

      if (!width || !height) {
        width = 800;
        height = 600;
      }

      // 四方に十分な安全余白を追加（負のviewBox座標や右端文字の見切れを防止）
      const margin = 16;
      const paddedMinX = Math.floor(minX - margin);
      const paddedMinY = Math.floor(minY - margin);
      const paddedWidth = Math.ceil(width + margin * 2);
      const paddedHeight = Math.ceil(height + margin * 2);

      const clonedSvg = svgElement.cloneNode(true);
      clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clonedSvg.setAttribute('xmlns:xhtml', 'http://www.w3.org/1999/xhtml');
      clonedSvg.setAttribute('viewBox', `${paddedMinX} ${paddedMinY} ${paddedWidth} ${paddedHeight}`);
      clonedSvg.setAttribute('width', `${paddedWidth}px`);
      clonedSvg.setAttribute('height', `${paddedHeight}px`);
      clonedSvg.style.removeProperty('max-width');

      // 描画時と完全に同一のフォントスタックを適用し、文字幅の膨張による見切れを防ぐ
      const style = document.createElement('style');
      const bgRule = includeBackground
        ? `background-color: ${currentTheme === 'dark' ? '#0f172a' : '#ffffff'};`
        : '';
      style.textContent = `
        svg, text, tspan, .label, .nodeLabel, .edgeLabel {
          font-family: ${EXPORT_FONT_FAMILY} !important;
        }
        svg { ${bgRule} }
      `;
      clonedSvg.insertBefore(style, clonedSvg.firstChild);

      let svgString = new XMLSerializer().serializeToString(clonedSvg);
      svgString = svgString.replace(/<br>/gi, '<br/>');

      return {
        svgString,
        width: paddedWidth,
        height: paddedHeight
      };
    }

    editorInput.addEventListener('input', scheduleRender);

    editorInput.addEventListener('paste', (e) => {
      const pasteData = (e.clipboardData || window.clipboardData).getData('text');
      if (!pasteData) return;

      const detected = detectContentMode(pasteData);
      if (detected && detected !== currentMode) {
        setTimeout(() => switchMode(detected, true, true), 0);
      }
    });

    editorInput.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editorInput.selectionStart;
        const end = editorInput.selectionEnd;
        const val = editorInput.value;

        if (start === end && !e.shiftKey) {
          editorInput.value = val.substring(0, start) + '    ' + val.substring(end);
          editorInput.selectionStart = editorInput.selectionEnd = start + 4;
        } else {
          const lineStart = val.lastIndexOf('\n', start - 1) + 1;
          let lineEnd = val.indexOf('\n', end);
          if (lineEnd === -1) lineEnd = val.length;

          const selectedText = val.substring(lineStart, lineEnd);
          const lines = selectedText.split('\n');

          if (!e.shiftKey) {
            const newLines = lines.map(line => '    ' + line);
            const replacement = newLines.join('\n');
            editorInput.value = val.substring(0, lineStart) + replacement + val.substring(lineEnd);
            editorInput.selectionStart = start + 4;
            editorInput.selectionEnd = end + (lines.length * 4);
          } else {
            let removedCountFirst = 0;
            let totalRemoved = 0;
            const newLines = lines.map((line, idx) => {
              const match = line.match(/^ {1,4}/);
              const removed = match ? match[0].length : 0;
              if (idx === 0) removedCountFirst = removed;
              totalRemoved += removed;
              return line.substring(removed);
            });
            const replacement = newLines.join('\n');
            editorInput.value = val.substring(0, lineStart) + replacement + val.substring(lineEnd);
            editorInput.selectionStart = Math.max(lineStart, start - removedCountFirst);
            editorInput.selectionEnd = Math.max(lineStart, end - totalRemoved);
          }
        }
        scheduleRender();
      }
    });

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        if (currentMode === 'mermaid') {
          downloadPngBtn.click();
        } else {
          downloadMdBtn.click();
        }
      }
    });

    zoomInBtn.addEventListener('click', () => {
      const rect = mermaidPreviewContainer.getBoundingClientRect();
      zoomToPoint(scale * 1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    zoomOutBtn.addEventListener('click', () => {
      const rect = mermaidPreviewContainer.getBoundingClientRect();
      zoomToPoint(scale * 0.8, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    zoomResetBtn.addEventListener('click', resetView);
    fitBtn.addEventListener('click', fitToScreen);

    copySvgBtn.addEventListener('click', () => {
      const svgElement = mermaidOutput.querySelector('svg');
      if (!svgElement) {
        showToast('コピー可能な図がありません');
        return;
      }
      const { svgString } = prepareCleanSvgForExport(svgElement, false);
      copyTextToClipboard(svgString, 'SVGコードをクリップボードにコピーしました');
    });

    downloadSvgBtn.addEventListener('click', () => {
      const svgElement = mermaidOutput.querySelector('svg');
      if (!svgElement) {
        showToast('保存可能な図がありません');
        return;
      }
      const { svgString } = prepareCleanSvgForExport(svgElement, false);
      const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const downloadLink = document.createElement('a');
      downloadLink.href = url;
      downloadLink.download = `mermaid-${Date.now()}.svg`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('SVG画像をダウンロードしました');
    });

    // ============================================================
    // 堅牢なPNG画像エクスポート処理 (SVG -> Canvas 変換)
    // ============================================================
    downloadPngBtn.addEventListener('click', () => {
      const svgElement = mermaidOutput.querySelector('svg');
      if (!svgElement) {
        showToast('保存可能な図がありません');
        return;
      }

      const { svgString, width, height } = prepareCleanSvgForExport(svgElement, true);

      const encodedData = encodeURIComponent(svgString)
        .replace(/'/g, '%27')
        .replace(/"/g, '%22');
      const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodedData;

      const img = new Image();
      img.crossOrigin = 'anonymous';

      img.onload = () => {
        const scaleFactor = 2;
        const canvas = document.createElement('canvas');
        canvas.width = width * scaleFactor;
        canvas.height = height * scaleFactor;

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = currentTheme === 'dark' ? '#0f172a' : '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          if (!blob) {
            showToast('PNG生成に失敗しました');
            return;
          }
          const downloadUrl = URL.createObjectURL(blob);
          const downloadLink = document.createElement('a');
          downloadLink.href = downloadUrl;
          downloadLink.download = `mermaid-${Date.now()}.png`;
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);

          setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
          showToast('PNG画像をダウンロードしました');
        }, 'image/png');
      };

      img.onerror = () => {
        showToast('PNG生成に失敗しました (画像レンダリング制限)');
      };

      img.src = dataUrl;
    });

    copyHtmlBtn.addEventListener('click', () => {
      if (!markdownPreviewContainer.innerHTML.trim()) {
        showToast('コピー可能なプレビューがありません');
        return;
      }

      const clone = markdownPreviewContainer.cloneNode(true);
      clone.querySelectorAll('.card-action-bar').forEach(el => el.remove());
      clone.querySelectorAll('[data-code]').forEach(el => {
        el.removeAttribute('data-code');
        el.removeAttribute('data-card-id');
      });

      copyTextToClipboard(clone.innerHTML.trim(), 'プレビューHTMLコードをコピーしました');
    });

    downloadMdBtn.addEventListener('click', () => {
      const text = editorInput.value;
      if (!text) {
        showToast('保存するテキストがありません');
        return;
      }
      const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const downloadLink = document.createElement('a');
      downloadLink.href = url;
      downloadLink.download = `document-${Date.now()}.md`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Markdownファイルをダウンロードしました');
    });

    clearBtn.addEventListener('click', () => {
      editorInput.value = '';
      if (currentMode === 'mermaid') {
        mermaidCode = '';
      } else {
        markdownCode = '';
      }
      renderPreview();
      if (currentMode === 'mermaid') resetView();
      saveState();
      showToast('内容を消去しました');
    });

    pasteBtn.addEventListener('click', async () => {
      try {
        let text = '';
        if (navigator.clipboard && navigator.clipboard.readText) {
          text = await navigator.clipboard.readText();
        } else {
          editorInput.focus();
          showToast('Ctrl+V (⌘+V) で貼り付けてください');
          return;
        }

        if (text) {
          editorInput.value = text;
          const detected = detectContentMode(text);
          if (detected && detected !== currentMode) {
            switchMode(detected, false, true);
          } else {
            if (currentMode === 'mermaid') {
              mermaidCode = text;
              renderPreview().then(() => fitToScreen());
            } else {
              markdownCode = text;
              renderPreview();
            }
          }
          saveState();
          showToast('貼り付けました');
        }
      } catch (_) {
        editorInput.focus();
        showToast('Ctrl+V (⌘+V) で貼り付けてください');
      }
    });

    // ============================================================
    // 初期ロード処理
    // ============================================================

    window.addEventListener('load', async () => {
      if (missingLibs.length > 0) {
        showCdnError();
        return;
      }
      if (document.fonts) {
        try {
          await document.fonts.ready;
        } catch (_) {}
      }

      const saved = loadState();
      let targetMode = 'markdown';

      if (saved) {
        currentTheme = saved.theme || 'default';
        themeSelect.value = currentTheme;
        mermaidCode = typeof saved.mermaidCode === 'string' ? saved.mermaidCode : MERMAID_TEMPLATES.flowchart;
        markdownCode = typeof saved.markdownCode === 'string' ? saved.markdownCode : MARKDOWN_TEMPLATES.spec;
        applyLayout(!!saved.isSideBySide);
        if (saved.currentMode === 'mermaid') {
          targetMode = 'mermaid';
        }
      }

      applyCanvasTheme(currentTheme);
      initMermaid(currentTheme);

      switchMode(targetMode, false);
    });
  </script>
</body>
</html>
