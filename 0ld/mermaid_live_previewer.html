<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid プレビューア</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js"></script>

  <style>
    /* テキストエリア・プレビューのスクロールバー */
    textarea::-webkit-scrollbar,
    .preview-container::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    textarea::-webkit-scrollbar-thumb,
    .preview-container::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    textarea::-webkit-scrollbar-thumb:hover,
    .preview-container::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /*
     * プレビュー領域
     * Pointer Events によるパン操作を行うため touch-action:none。
     */
    .draggable-viewport {
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .draggable-viewport.dragging {
      cursor: grabbing;
    }

    /*
     * 図の配置用レイヤー。
     * 画面中央を基準点として、translate と scale を分離する。
     * 自身の中心（-50%, -50%）をコンテナ中央（50%, 50%）に重ねる。
     */
    #transformWrapper {
      position: absolute;
      left: 50%;
      top: 50%;
      display: inline-block;
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    /*
     * スケール専用レイヤー。
     * パンとズームを分離することで、マウスポインタ中心ズームを
     * 安定して計算できる。
     */
    #scaleWrapper {
      display: inline-block;
      transform-origin: center center;
      will-change: transform;
    }

    /*
     * SVGが親要素を超えた場合でもレイアウトを壊さない。
     */
    #mermaidOutput {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #mermaidOutput svg {
      display: block;
      max-width: none;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">

      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
          M
        </div>

        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">
            Mermaid Previewer
          </h1>

          <p class="text-xs text-slate-500 hidden sm:block">
            リアルタイム構文プレビュー & エクスポート
          </p>
        </div>
      </div>

      <!-- コントロール群 -->
      <div class="flex flex-wrap items-center gap-2">

        <!-- テンプレート選択 -->
        <select
          id="templateSelect"
          class="text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-md px-2.5 py-1.5 font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500"
          aria-label="サンプル図を挿入"
        >
          <option value="" disabled selected>📐 サンプル図を挿入...</option>
          <option value="flowchart">フローチャート (Flowchart)</option>
          <option value="sequence">シーケンス図 (Sequence)</option>
          <option value="classDiagram">クラス図 (Class Diagram)</option>
          <option value="stateDiagram">状態遷移図 (State)</option>
          <option value="erDiagram">ER図 (Entity Relationship)</option>
          <option value="gantt">ガントチャート (Gantt)</option>
          <option value="mindmap">マインドマップ (Mindmap)</option>
        </select>

        <!-- テーマ切り替え -->
        <select
          id="themeSelect"
          class="text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-md px-2.5 py-1.5 font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500"
          aria-label="テーマを選択"
        >
          <option value="default">テーマ: デフォルト</option>
          <option value="neutral">テーマ: ニュートラル</option>
          <option value="dark">テーマ: ダーク</option>
          <option value="forest">テーマ: フォレスト</option>
        </select>

        <!-- レイアウト切り替え -->
        <button
          type="button"
          id="layoutToggleBtn"
          class="hidden md:inline-flex items-center gap-1 text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-medium px-2.5 py-1.5 rounded-md transition-colors"
          title="上下並びと左右並びを切り替えます"
          aria-label="レイアウトを切り替え"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>

          <span id="layoutText">左右分割に切替</span>
        </button>

      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6 flex flex-col gap-4">

    <!-- ワークスペース -->
    <div
      id="workspace"
      class="flex flex-col gap-4 flex-1"
    >

      <!-- エディタ -->
      <section class="flex flex-col bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex-1 min-h-[260px] md:min-h-[300px]">

        <div class="bg-slate-100/80 px-4 py-2 border-b border-slate-200 flex items-center justify-between">

          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-600">
              Mermaid Code
            </span>

            <span
              id="charCount"
              class="text-[11px] text-slate-600 bg-white px-1.5 py-0.5 rounded border border-slate-200"
            >
              0 文字
            </span>
          </div>

          <div class="flex items-center gap-1.5">

            <button
              type="button"
              id="pasteBtn"
              class="text-xs text-slate-600 hover:text-indigo-600 font-medium px-2 py-1 rounded hover:bg-slate-200 transition-colors"
              title="クリップボードから貼り付け"
            >
              ペースト
            </button>

            <button
              type="button"
              id="clearBtn"
              class="text-xs text-slate-600 hover:text-red-600 font-medium px-2 py-1 rounded hover:bg-slate-200 transition-colors"
              title="内容を消去"
            >
              クリア
            </button>

          </div>
        </div>

        <div class="relative flex-1">

          <textarea
            id="mermaidInput"
            spellcheck="false"
            placeholder="ここにMermaid記法をペーストまたは入力してください...

例:
graph TD;
    A[開始] --> B{判定};
    B -- はい --> C[処理実行];
    B -- いいえ --> D[終了];
    C --> D;"
            class="w-full h-full min-h-[220px] p-3.5 font-mono text-xs sm:text-sm text-slate-800 bg-transparent resize-y md:resize-none focus:outline-none leading-relaxed"
            aria-label="Mermaidコード入力"
          ></textarea>

        </div>
      </section>

      <!-- プレビュー -->
      <section class="flex flex-col bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex-1 min-h-[340px] md:min-h-[380px]">

        <div class="bg-slate-100/80 px-4 py-2 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">

          <div class="flex items-center gap-2">

            <span class="text-xs font-semibold uppercase tracking-wider text-slate-600">
              Diagram Preview
            </span>

            <span
              id="statusIndicator"
              class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 text-emerald-800"
            >
              正常
            </span>

          </div>

          <!-- 操作ツールバー -->
          <div class="flex items-center gap-1">

            <button
              type="button"
              id="zoomOutBtn"
              class="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors"
              title="縮小"
              aria-label="縮小"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M20 12H4"
                ></path>
              </svg>
            </button>

            <button
              type="button"
              id="zoomResetBtn"
              class="px-2 py-1 text-xs font-mono text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors"
              title="表示倍率リセット"
              aria-label="表示倍率を100パーセントにリセット"
            >
              <span id="zoomLevel">100%</span>
            </button>

            <!-- 画面枠内に全体を収めるFitボタン -->
            <button
              type="button"
              id="fitBtn"
              class="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors flex items-center gap-1"
              title="画面サイズに合わせる"
              aria-label="画面枠内に全体表示"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
              </svg>
              <span class="text-[11px] hidden sm:inline font-medium">フィット</span>
            </button>

            <button
              type="button"
              id="zoomInBtn"
              class="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors"
              title="拡大"
              aria-label="拡大"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v16m8-8H4"
                ></path>
              </svg>
            </button>

            <div class="w-px h-4 bg-slate-300 mx-1"></div>

            <button
              type="button"
              id="copySvgBtn"
              class="text-xs text-slate-700 bg-white hover:bg-slate-100 border border-slate-300 font-medium px-2 py-1 rounded transition-colors"
              title="SVGコードをクリップボードにコピー"
            >
              SVGコピー
            </button>

            <button
              type="button"
              id="downloadSvgBtn"
              class="text-xs text-slate-700 bg-white hover:bg-slate-100 border border-slate-300 font-medium px-2 py-1 rounded transition-colors"
              title="SVG画像としてダウンロード"
            >
              SVG保存
            </button>

            <button
              type="button"
              id="downloadPngBtn"
              class="text-xs text-white bg-indigo-600 hover:bg-indigo-700 font-medium px-2.5 py-1 rounded transition-colors shadow-sm"
              title="PNG画像としてダウンロード"
            >
              PNG保存
            </button>

          </div>
        </div>

        <!-- プレビューキャンバス -->
        <div
          id="previewContainer"
          class="relative flex-1 overflow-hidden bg-slate-50/50 draggable-viewport flex items-center justify-center p-4 transition-colors duration-200"
          aria-label="Mermaid図のプレビュー領域"
        >

          <!--
            パン用レイヤー
            viewport中央を基準に配置
          -->
          <div id="transformWrapper">

            <!--
              ズーム用レイヤー
              パンとズームのtransformを分離
            -->
            <div id="scaleWrapper">

              <div id="mermaidOutput">
                <!-- Mermaid SVG -->
              </div>

            </div>
          </div>

          <!-- エラー通知 -->
          <div
            id="errorBox"
            class="hidden absolute bottom-4 left-4 right-4 bg-red-50/95 border border-red-200 text-red-700 p-3 rounded-lg shadow-md backdrop-blur-sm z-20"
          >

            <div class="flex items-start gap-2">

              <svg
                class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>

              <div class="flex-1 overflow-auto max-h-24">

                <h4 class="text-xs font-bold">
                  構文エラーが発生しました
                </h4>

                <p
                  id="errorMessage"
                  class="text-xs font-mono mt-0.5 whitespace-pre-wrap leading-relaxed text-red-600"
                ></p>

              </div>
            </div>
          </div>

          <!-- 初期空状態 -->
          <div
            id="emptyGuide"
            class="hidden absolute inset-0 flex flex-col items-center justify-center text-slate-400 pointer-events-none p-6 text-center"
          >

            <svg
              class="w-12 h-12 mb-3 text-slate-300"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
              ></path>
            </svg>

            <p class="text-sm font-medium">
              テキストフィールドにMermaid記法を入力すると
            </p>

            <p class="text-xs mt-1">
              ここにリアルタイムで図がプレビューされます
            </p>

          </div>

        </div>
      </section>

    </div>
  </main>

  <!-- トースト -->
  <div
    id="toast"
    class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-3.5 py-2 rounded-lg shadow-lg transform translate-y-12 opacity-0 transition-all duration-200 pointer-events-none z-50"
  >
    通知メッセージ
  </div>

  <script>
    // ============================================================
    // Mermaidテンプレート
    // ============================================================

    const TEMPLATES = {
      flowchart: `graph TD
    A[ユーザーアクセス] --> B{ログイン状態?}
    B -- ログイン済 --> C[ダッシュボード表示]
    B -- 未ログイン --> D[認証画面へ遷移]
    D --> E[ID・パスワード入力]
    E --> B`,

      sequence: `sequenceDiagram
    autonumber
    actor User as ユーザー
    participant Browser as ブラウザ (SPA)
    participant Server as APIサーバ
    participant DB as データベース

    User->>Browser: ログインボタン押下
    Browser->>Server: POST /api/login
    Server->>DB: 認証情報検証
    DB-->>Server: OK
    Server-->>Browser: JWTトークン返却
    Browser-->>User: 画面遷移`,

      classDiagram: `classDiagram
    class User {
      +String id
      +String email
      +login()
      +logout()
    }
    class AdminUser {
      +String[] permissions
      +deleteUser(id)
    }
    User <|-- AdminUser : 継承`,

      stateDiagram: `stateDiagram-v2
    [*] --> 未注文
    未注文 --> 注文完了 : 決済実行
    注文完了 --> 発送準備中 : 在庫確認
    発送準備中 --> 発送済 : 配送業者引渡
    発送済 --> 配達完了 : 受取
    配達完了 --> [*]`,

      erDiagram: `erDiagram
    CUSTOMER ||--o{ ORDER : places
    ORDER ||--|{ LINE-ITEM : contains
    CUSTOMER }|..|{ DELIVERY-ADDRESS : uses`,

      gantt: `gantt
    title システム開発スケジュール
    dateFormat YYYY-MM-DD
    section 要件定義
    ヒアリング       :done,    des1, 2026-09-01,2026-09-07
    仕様確定         :active,  des2, 2026-09-08, 5d
    section 開発
    フロントエンド実装 :         des3, after des2, 10d
    API連携          :         des4, after des3, 5d`,

      mindmap: `mindmap
  root((Webアプリ開発))
    フロントエンド
      Vue
      React
      Tailwind CSS
    バックエンド
      Go
      Node.js
    インフラ
      Docker
      Cloud`
    };

    // ============================================================
    // DOM要素の参照
    // ============================================================

    const mermaidInput = document.getElementById('mermaidInput');
    const mermaidOutput = document.getElementById('mermaidOutput');
    const previewContainer = document.getElementById('previewContainer');
    const transformWrapper = document.getElementById('transformWrapper');
    const scaleWrapper = document.getElementById('scaleWrapper');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const emptyGuide = document.getElementById('emptyGuide');
    const statusIndicator = document.getElementById('statusIndicator');
    const charCount = document.getElementById('charCount');
    const templateSelect = document.getElementById('templateSelect');
    const themeSelect = document.getElementById('themeSelect');
    const layoutToggleBtn = document.getElementById('layoutToggleBtn');
    const layoutText = document.getElementById('layoutText');
    const workspace = document.getElementById('workspace');

    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomLevel = document.getElementById('zoomLevel');
    const fitBtn = document.getElementById('fitBtn');
    const copySvgBtn = document.getElementById('copySvgBtn');
    const downloadSvgBtn = document.getElementById('downloadSvgBtn');
    const downloadPngBtn = document.getElementById('downloadPngBtn');
    const clearBtn = document.getElementById('clearBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const toast = document.getElementById('toast');

    // ============================================================
    // 状態 & 永続化
    // ============================================================

    const STORAGE_KEY = 'mermaid_live_previewer_state_v1';
    let resizeTimer = null;

    let currentTheme = 'default';
    let isSideBySide = false;
    let debounceTimer = null;
    let renderVersion = 0;
    let renderCount = 0;

    function applyCanvasTheme(theme) {
      if (theme === 'dark') {
        previewContainer.classList.remove('bg-slate-50/50');
        previewContainer.classList.add('bg-slate-900');
      } else {
        previewContainer.classList.remove('bg-slate-900');
        previewContainer.classList.add('bg-slate-50/50');
      }
    }

    function saveState() {
      try {
        const state = {
          code: mermaidInput.value,
          theme: currentTheme,
          isSideBySide: isSideBySide
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;
      }
    }

    // ============================================================
    // パン・ズーム状態 & ポインタ管理
    // ============================================================

    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    const MIN_SCALE = 0.2;
    const MAX_SCALE = 4.0;

    // アクティブなポインタ追跡用 (マルチタッチ対応)
    const activePointers = new Map();
    let initialPinchDistance = null;
    let initialScale = 1;

    // ============================================================
    // Mermaid初期化
    // ============================================================

    function initMermaid(theme = 'default') {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: theme,
        flowchart: {
          useMaxWidth: false,
          htmlLabels: true
        },
        sequence: {
          useMaxWidth: false
        }
      });
    }

    // ============================================================
    // トースト通知
    // ============================================================

    let toastTimer = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove('translate-y-12', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-12', 'opacity-0');
      }, 2400);
    }

    // ============================================================
    // ステータス表示
    // ============================================================

    function setStatus(type, text) {
      statusIndicator.textContent = text;
      const baseClass = 'inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium';
      const classes = {
        waiting: 'bg-slate-100 text-slate-600',
        rendering: 'bg-amber-100 text-amber-800',
        success: 'bg-emerald-100 text-emerald-800',
        error: 'bg-red-100 text-red-800'
      };
      statusIndicator.className = `${baseClass} ${classes[type] || classes.waiting}`;
    }

    // ============================================================
    // Transform更新（translate と scale の分離適用）
    // ============================================================

    function updateTransform() {
      // (50%, 50%)から要素自身の中心（-50%, -50%）を重ねた上でパン移動量を反映
      transformWrapper.style.transform = `translate(calc(-50% + ${translateX}px), calc(-50% + ${translateY}px))`;
      scaleWrapper.style.transform = `scale(${scale})`;
      zoomLevel.textContent = `${Math.round(scale * 100)}%`;
    }

    function resetView() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    /*
     * 画面枠内に図全体を収める自動スケール計算
     */
    function fitToScreen() {
      const svg = mermaidOutput.querySelector('svg');
      if (!svg) return;

      let svgW = 0;
      let svgH = 0;

      // 1. viewBoxから図本来の寸法を取得
      if (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
        svgW = svg.viewBox.baseVal.width;
        svgH = svg.viewBox.baseVal.height;
      } else {
        try {
          const bbox = svg.getBBox();
          if (bbox.width > 0) {
            svgW = bbox.width;
            svgH = bbox.height;
          }
        } catch (_) {}
      }

      if (!svgW || !svgH) {
        const rect = svg.getBoundingClientRect();
        svgW = rect.width / (scale || 1);
        svgH = rect.height / (scale || 1);
      }

      if (!svgW || !svgH) return;

      const containerRect = previewContainer.getBoundingClientRect();
      const padding = 28; // 周囲の余白
      const availW = Math.max(containerRect.width - padding, 80);
      const availH = Math.max(containerRect.height - padding, 80);

      // コンテナ内に収まる最適なスケールを算出（最大1.1倍までに抑える）
      const fitScale = Math.min(availW / svgW, availH / svgH);
      scale = Math.min(Math.max(fitScale, MIN_SCALE), 1.1);
      translateX = 0;
      translateY = 0;

      updateTransform();
    }

    // ============================================================
    // ズーム計算（特定座標を中心とした拡大縮小）
    // ============================================================

    /**
     * @param {number} newScale 次の倍率
     * @param {number} originClientX ズームの中心点 (Viewport X座標)
     * @param {number} originClientY ズームの中心点 (Viewport Y座標)
     */
    function zoomToPoint(newScale, originClientX, originClientY) {
      const clampedScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);
      if (clampedScale === scale) return;

      const rect = previewContainer.getBoundingClientRect();
      // ビューポート中心を (0,0) としたポインタ座標
      const px = originClientX - (rect.left + rect.width / 2);
      const py = originClientY - (rect.top + rect.height / 2);

      // ポインタ直下の図の点がズレないよう translate を補正
      const scaleRatio = clampedScale / scale;
      translateX = px - (px - translateX) * scaleRatio;
      translateY = py - (py - translateY) * scaleRatio;
      scale = clampedScale;

      updateTransform();
    }

    // ============================================================
    // 非同期レンダリング処理（世代管理つき）
    // ============================================================

    async function renderDiagram() {
      const code = mermaidInput.value.trim();
      charCount.textContent = `${code.length} 文字`;

      if (!code) {
        mermaidOutput.innerHTML = '';
        errorBox.classList.add('hidden');
        emptyGuide.classList.remove('hidden');
        setStatus('waiting', '入力待ち');
        return;
      }

      emptyGuide.classList.add('hidden');
      setStatus('rendering', 'レンダリング中...');

      // 世代番号をインクリメント（最新の実行のみを採用）
      renderVersion++;
      const currentVersion = renderVersion;
      renderCount++;
      const uniqueId = `mermaid-render-${Date.now()}-${renderCount}`;

      try {
        // 構文チェック
        await mermaid.parse(code);

        // SVG生成
        const { svg } = await mermaid.render(uniqueId, code);

        // 並走していた後続リクエストがある場合は破棄
        if (currentVersion !== renderVersion) {
          return;
        }

        mermaidOutput.innerHTML = svg;
        errorBox.classList.add('hidden');
        setStatus('success', '正常描画');

        // 初回描画または極端なサイズ変化時に画面内に収める
        if (currentVersion === 1) {
          fitToScreen();
        }
      } catch (err) {
        if (currentVersion !== renderVersion) {
          return;
        }

        const msg = err.message || err.str || String(err);
        errorMessage.textContent = msg;
        errorBox.classList.remove('hidden');
        setStatus('error', '構文エラー');
      }
    }

    function scheduleRender() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        renderDiagram();
        saveState();
      }, 250);
    }

    // ============================================================
    // Pointer Events によるパン & マルチタッチ操作
    // ============================================================

    function getDistance(p1, p2) {
      const dx = p1.clientX - p2.clientX;
      const dy = p1.clientY - p2.clientY;
      return Math.hypot(dx, dy);
    }

    function getMidpoint(p1, p2) {
      return {
        clientX: (p1.clientX + p2.clientX) / 2,
        clientY: (p1.clientY + p2.clientY) / 2
      };
    }

    previewContainer.addEventListener('pointerdown', (e) => {
      // ツールバーやエラーボックスのクリックは無視
      if (e.target.closest('button') || e.target.closest('#errorBox') || e.target.closest('select')) {
        return;
      }

      previewContainer.setPointerCapture(e.pointerId);
      previewContainer.classList.add('dragging');
      activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

      if (activePointers.size === 2) {
        const [p1, p2] = Array.from(activePointers.values());
        initialPinchDistance = getDistance(p1, p2);
        initialScale = scale;
      }
    });

    previewContainer.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;

      const prevPos = activePointers.get(e.pointerId);

      if (activePointers.size === 1) {
        // 単一ポインタ: 通常のパン移動
        const dx = e.clientX - prevPos.clientX;
        const dy = e.clientY - prevPos.clientY;
        translateX += dx;
        translateY += dy;
        updateTransform();
        activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
      } else if (activePointers.size === 2) {
        // 2点タッチ: ピンチズーム & パン
        activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
        const [p1, p2] = Array.from(activePointers.values());
        const currentDistance = getDistance(p1, p2);

        if (initialPinchDistance && initialPinchDistance > 0) {
          const ratio = currentDistance / initialPinchDistance;
          const targetScale = initialScale * ratio;
          const mid = getMidpoint(p1, p2);
          zoomToPoint(targetScale, mid.clientX, mid.clientY);
        }
      }
    });

    function handlePointerEnd(e) {
      if (activePointers.has(e.pointerId)) {
        activePointers.delete(e.pointerId);
        try {
          previewContainer.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }

      if (activePointers.size < 2) {
        initialPinchDistance = null;
      }
      if (activePointers.size === 0) {
        previewContainer.classList.remove('dragging');
      }
    }

    previewContainer.addEventListener('pointerup', handlePointerEnd);
    previewContainer.addEventListener('pointercancel', handlePointerEnd);

    // マウスホイールによるポインタ中心ズーム
    previewContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
      zoomToPoint(scale * zoomFactor, e.clientX, e.clientY);
    }, { passive: false });

    // ============================================================
    // ボタン操作（ズーム、リセット、エクスポートなど）
    // ============================================================

    zoomInBtn.addEventListener('click', () => {
      const rect = previewContainer.getBoundingClientRect();
      zoomToPoint(scale * 1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    zoomOutBtn.addEventListener('click', () => {
      const rect = previewContainer.getBoundingClientRect();
      zoomToPoint(scale * 0.8, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    zoomResetBtn.addEventListener('click', () => {
      resetView();
    });

    fitBtn.addEventListener('click', () => {
      fitToScreen();
    });

    // SVGクリップボードコピー（navigator.clipboard 優先）
    copySvgBtn.addEventListener('click', async () => {
      const svgElement = mermaidOutput.querySelector('svg');
      if (!svgElement) {
        showToast('コピー可能な図がありません');
        return;
      }
      const svgData = new XMLSerializer().serializeToString(svgElement);

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(svgData);
          showToast('SVGコードをクリップボードにコピーしました');
          return;
        } catch (_) {}
      }

      // レガシーフォールバック
      const tempArea = document.createElement('textarea');
      tempArea.value = svgData;
      tempArea.style.position = 'fixed';
      tempArea.style.opacity = '0';
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        showToast('SVGコードをクリップボードにコピーしました');
      } catch (e) {
        showToast('コピーに失敗しました');
      }
      document.body.removeChild(tempArea);
    });

    // SVGファイルダウンロード
    downloadSvgBtn.addEventListener('click', () => {
      const svgElement = mermaidOutput.querySelector('svg');
      if (!svgElement) {
        showToast('保存可能な図がありません');
        return;
      }
      const svgData = new XMLSerializer().serializeToString(svgElement);
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const downloadLink = document.createElement('a');
      downloadLink.href = url;
      downloadLink.download = `mermaid-${Date.now()}.svg`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(url);
      showToast('SVG画像をダウンロードしました');
    });

    // PNGファイルダウンロード（高解像度 Canvas レンダリング）
    downloadPngBtn.addEventListener('click', () => {
      const svgElement = mermaidOutput.querySelector('svg');
      if (!svgElement) {
        showToast('保存可能な図がありません');
        return;
      }

      let width = 0;
      let height = 0;
      if (svgElement.viewBox && svgElement.viewBox.baseVal && svgElement.viewBox.baseVal.width > 0) {
        width = svgElement.viewBox.baseVal.width;
        height = svgElement.viewBox.baseVal.height;
      } else {
        const rect = svgElement.getBoundingClientRect();
        width = rect.width / (scale || 1);
        height = rect.height / (scale || 1);
      }
      if (!width || !height) {
        width = 800;
        height = 600;
      }

      const clonedSvg = svgElement.cloneNode(true);
      clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clonedSvg.setAttribute('width', width);
      clonedSvg.setAttribute('height', height);

      const svgData = new XMLSerializer().serializeToString(clonedSvg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        const scaleFactor = 2; // 高解像度（2倍スケール）
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(width * scaleFactor);
        canvas.height = Math.round(height * scaleFactor);

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = currentTheme === 'dark' ? '#0f172a' : '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        canvas.toBlob((blob) => {
          if (!blob) {
            showToast('PNG生成に失敗しました');
            return;
          }
          const downloadUrl = URL.createObjectURL(blob);
          const downloadLink = document.createElement('a');
          downloadLink.href = downloadUrl;
          downloadLink.download = `mermaid-${Date.now()}.png`;
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          URL.revokeObjectURL(downloadUrl);
          showToast('PNG画像をダウンロードしました');
        }, 'image/png');
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        showToast('PNG生成に失敗しました');
      };
      img.src = url;
    });

    // クリア
    clearBtn.addEventListener('click', () => {
      mermaidInput.value = '';
      renderDiagram();
      resetView();
      saveState();
      showToast('内容を消去しました');
    });

    // ペースト
    pasteBtn.addEventListener('click', async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          mermaidInput.value = text;
          renderDiagram();
          resetView();
          saveState();
          showToast('貼り付けました');
        } else {
          mermaidInput.focus();
          showToast('Ctrl+V (⌘+V) で貼り付けてください');
        }
      } catch (err) {
        mermaidInput.focus();
        showToast('Ctrl+V (⌘+V) で貼り付けてください');
      }
    });

    // ============================================================
    // イベントバインド（入力・選択・レイアウト）
    // ============================================================

    templateSelect.addEventListener('change', (e) => {
      const key = e.target.value;
      if (TEMPLATES[key]) {
        mermaidInput.value = TEMPLATES[key];
        saveState();
        renderDiagram().then(() => {
          fitToScreen();
        });
        showToast('サンプルを挿入しました');
      }
      e.target.value = '';
    });

    themeSelect.addEventListener('change', (e) => {
      currentTheme = e.target.value;
      applyCanvasTheme(currentTheme);
      initMermaid(currentTheme);
      saveState();
      renderDiagram().then(() => {
        fitToScreen();
      });
      showToast(`テーマを [${themeSelect.options[themeSelect.selectedIndex].text}] に設定しました`);
    });

    layoutToggleBtn.addEventListener('click', () => {
      isSideBySide = !isSideBySide;
      if (isSideBySide) {
        workspace.classList.remove('flex-col');
        workspace.classList.add('md:flex-row');
        layoutText.textContent = '上下配置に切替';
      } else {
        workspace.classList.add('flex-col');
        workspace.classList.remove('md:flex-row');
        layoutText.textContent = '左右分割に切替';
      }
      saveState();
      setTimeout(() => fitToScreen(), 50);
    });

    mermaidInput.addEventListener('input', scheduleRender);

    // 画面の向き変更・リサイズ時にも自動で収まりを再調整
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        fitToScreen();
      }, 150);
    });

    // Tab / Shift+Tab によるインデント・アンインデント（単一行・複数行対応）
    mermaidInput.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = mermaidInput.selectionStart;
        const end = mermaidInput.selectionEnd;
        const val = mermaidInput.value;

        if (start === end && !e.shiftKey) {
          // 単一行・カーソル位置への4スペース挿入
          mermaidInput.value = val.substring(0, start) + '    ' + val.substring(end);
          mermaidInput.selectionStart = mermaidInput.selectionEnd = start + 4;
        } else {
          // 複数行またはShift+Tabでのアンインデント
          const lineStart = val.lastIndexOf('\n', start - 1) + 1;
          let lineEnd = val.indexOf('\n', end);
          if (lineEnd === -1) lineEnd = val.length;

          const selectedText = val.substring(lineStart, lineEnd);
          const lines = selectedText.split('\n');

          if (!e.shiftKey) {
            // 各行に4スペース追加（インデント）
            const newLines = lines.map(line => '    ' + line);
            const replacement = newLines.join('\n');
            mermaidInput.value = val.substring(0, lineStart) + replacement + val.substring(lineEnd);
            mermaidInput.selectionStart = start + 4;
            mermaidInput.selectionEnd = end + (lines.length * 4);
          } else {
            // 各行から先頭の最大4スペースを削除（アンインデント）
            let removedCountFirst = 0;
            let totalRemoved = 0;
            const newLines = lines.map((line, idx) => {
              const match = line.match(/^ {1,4}/);
              const removed = match ? match[0].length : 0;
              if (idx === 0) removedCountFirst = removed;
              totalRemoved += removed;
              return line.substring(removed);
            });
            const replacement = newLines.join('\n');
            mermaidInput.value = val.substring(0, lineStart) + replacement + val.substring(lineEnd);
            mermaidInput.selectionStart = Math.max(lineStart, start - removedCountFirst);
            mermaidInput.selectionEnd = Math.max(lineStart, end - totalRemoved);
          }
        }
        scheduleRender();
      }
    });

    // ============================================================
    // 初期ロード & 状態復元
    // ============================================================

    window.addEventListener('DOMContentLoaded', () => {
      const saved = loadState();

      if (saved) {
        currentTheme = saved.theme || 'default';
        themeSelect.value = currentTheme;
        mermaidInput.value = typeof saved.code === 'string' ? saved.code : TEMPLATES.flowchart;

        if (saved.isSideBySide) {
          isSideBySide = true;
          workspace.classList.remove('flex-col');
          workspace.classList.add('md:flex-row');
          layoutText.textContent = '上下配置に切替';
        }
      } else {
        mermaidInput.value = TEMPLATES.flowchart;
      }

      applyCanvasTheme(currentTheme);
      initMermaid(currentTheme);

      renderDiagram().then(() => {
        fitToScreen();
      });
    });
  </script>
</body>
</html>
